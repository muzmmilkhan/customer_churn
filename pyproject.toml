[project]
name = "customer-churn"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "muzmmil_pathan", email = "muzmmil_pathan@apple.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.2",
    "ipykernel>=7.4.0",
    "joblib>=1.6.0",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "streamlit>=1.67.0",
    "tensorflow>=2.21.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
customer-churn = "customer_churn:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
